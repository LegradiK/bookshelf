{% extends "base.html" %}
{% block title %}Add a book{% endblock %}

{% block content %}
<h1 class="page-title">Find a book</h1>
<p class="page-subtitle">Type a title and/or author to search.</p>

<div class="search-box">
<input
type="text"
id="search-input"
class="search-input"
placeholder="e.g. Hamlet William Shakespeare"
autofocus
autocomplete="off"
    >
</div>

<div id="search-status" class="search-status"></div>
<div id="search-results" class="search-results"></div>
{% endblock %}

{% block scripts %}
<script>
initBookSearch();
</script>
{% endblock %}
