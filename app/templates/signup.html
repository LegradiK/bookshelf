{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Sign Up</h1>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ request.form.get('username', '') }}"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >
            </div>

            <button type="submit" class="nav-cta signup-button">Sign Up</button>
        </form>

        <div class="sign-up-page-navigate">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
